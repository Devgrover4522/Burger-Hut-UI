<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Burger Hut | Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
body { background:#0b0b0b; color:#fff; font-family: sans-serif; }
.cart-item{
  background:#fff; 
  color:#000; 
  border-radius:12px; 
  display:flex; 
  align-items:center; 
  padding:16px; 
  transition:.3s;
}
.cart-item:hover{ transform:translateY(-4px); box-shadow:0 20px 50px rgba(252,191,73,.2); }
.cart-item img{ width:100px; height:100px; border-radius:12px; object-fit:cover; }
.qty-btn{ background:#fcbf49; color:#000; font-weight:700; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.qty-input{ width:40px; text-align:center; border-radius:6px; padding:4px; border:1px solid #ccc; }
.summary{ background:#1a1a1a; padding:20px; border-radius:12px; border:1px solid rgba(255,255,255,.08);}
.sticky-summary{ position:sticky; top:20px; }
</style>
</head>
<body class="bg-[#0b0b0b]">

<!-- HEADER -->
<header class="sticky top-0 z-50 bg-black/70 backdrop-blur border-b border-white/10">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <a href="menu.html" class="text-xl font-extrabold tracking-widest text-[#fcbf49]">BURGER HUT</a>
    <a href="menu.html" class="text-sm text-gray-400 hover:text-[#fcbf49]">← Back to Menu</a>
  </div>
</header>

<section class="py-12 max-w-7xl mx-auto px-6">
  <h1 class="text-4xl font-bold mb-8 text-white">🛒 Your Cart</h1>
  <div class="grid lg:grid-cols-3 gap-8">
    
    <!-- ITEMS LIST -->
    <div class="lg:col-span-2 space-y-4" id="cartItemsContainer">
      <!-- Cart items render here -->
    </div>

    <!-- SUMMARY PANEL -->
    <div class="sticky-summary">
      <div class="summary">
        <h2 class="text-xl font-bold mb-4">Order Summary</h2>
        <div class="flex justify-between mb-2">
          <span>Total Items:</span>
          <span id="summaryCount">0</span>
        </div>
        <div class="flex justify-between mb-2">
          <span>Subtotal:</span>
          <span>₹<span id="cartTotal">0</span></span>
        </div>
        <button onclick="checkout()" class="w-full mt-4 py-3 bg-[#fcbf49] text-black font-bold rounded-full hover:scale-105 transition transform">
          Proceed to Pay
        </button>
      </div>
    </div>

  </div>
</section>

<footer class="py-6 text-center text-gray-500 text-sm border-t border-white/10">
  © 2026 Burger Hut • 100% Veg Kitchen
</footer>

<script>
// CART STORAGE
let cart = JSON.parse(localStorage.getItem('cart')) || [];

function renderCart(){
  const container = document.getElementById('cartItemsContainer');
  container.innerHTML='';
  let total = 0;
  let itemCount = 0;

  if(cart.length===0){
    container.innerHTML='<p class="text-gray-400 text-center py-10 text-lg">Your cart is empty.</p>';
  }

  cart.forEach((item,index)=>{
    total += item.price * item.qty;
    itemCount += item.qty;

    container.innerHTML += `
      <div class="cart-item">
        <img src="${item.img}" alt="${item.name}">
        <div class="flex-1 px-4">
          <h3 class="font-semibold text-lg mb-1">${item.name}</h3>
          <p class="text-gray-600 mb-2">₹${item.price} each</p>
          <div class="flex items-center gap-2">
            <div class="qty-btn" onclick="changeQty(${index},-1)">-</div>
            <input type="number" value="${item.qty}" min="1" class="qty-input" onchange="updateQty(${index},this.value)">
            <div class="qty-btn" onclick="changeQty(${index},1)">+</div>
          </div>
        </div>
        <div class="flex flex-col items-end gap-2">
          <span class="font-bold text-lg">₹${item.price*item.qty}</span>
          <a href="https://wa.me/91XXXXXXXXXX?text=I want ${encodeURIComponent(item.name)} x${item.qty}" target="_blank"
             class="bg-[#25D366] px-4 py-1 rounded-full text-black text-sm font-semibold hover:scale-105 transition">WhatsApp</a>
          <button onclick="removeItem(${index})" class="text-red-500 font-bold">✕ Remove</button>
        </div>
      </div>
    `;
  });

  document.getElementById('cartTotal').innerText = total;
  document.getElementById('summaryCount').innerText = itemCount;
  localStorage.setItem('cart', JSON.stringify(cart));
}

function changeQty(index, delta){
  cart[index].qty += delta;
  if(cart[index].qty <1) cart[index].qty=1;
  renderCart();
}

function updateQty(index, value){
  cart[index].qty = parseInt(value) || 1;
  renderCart();
}

function removeItem(index){
  cart.splice(index,1);
  renderCart();
}

function checkout(){
  if(cart.length===0){
    alert("Cart is empty!");
    return;
  }
  let total = cart.reduce((sum,item)=>sum+item.price*item.qty,0)*100;
  const options = {
    key: "rzp_test_XXXXXXXX",
    amount: total,
    currency: "INR",
    name: "Burger Hut",
    description: "Veg Order",
    handler: function(response){
      alert("Payment Successful! Payment ID: "+response.razorpay_payment_id);
      cart=[];
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    },
    theme: {color:"#fcbf49"}
  };
  new Razorpay(options).open();
}

renderCart();
</script>

</body>
</html>
